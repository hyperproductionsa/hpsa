    <script>
        (() => {
            const audio = new Audio('https://cdn.hyperproduction.co.za/samples/HYP055.m4a');
            audio.preload = 'none';
            const button = document.getElementById('preview-toggle');

            const setPlaying = (playing) => {
                button.classList.toggle('is-playing', playing);
                button.setAttribute('aria-pressed', String(playing));
                button.setAttribute('aria-label', playing ? 'Pause audio preview' : 'Play audio preview');
            };

            button.addEventListener('click', async () => {
                if (audio.paused) {
                    try {
                        await audio.play();
                    } catch (error) {
                        setPlaying(false);
                    }
                } else {
                    audio.pause();
                }
            });

            audio.addEventListener('play', () => setPlaying(true));
            audio.addEventListener('pause', () => setPlaying(false));
            audio.addEventListener('ended', () => setPlaying(false));
            audio.addEventListener('error', () => setPlaying(false));
        })();
    </script>
