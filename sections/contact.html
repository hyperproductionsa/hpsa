<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Hyper Production (SA)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #contact {
            width: 100%;
            height: 184px;
            background: #e4de69;
            display: flex;
            align-items: flex-start;
            padding: 0 40px;
        }

        .contact-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            height: 100%;
            padding-top: 20px;
        }

        .contact-col {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Forces everything to the top */
        }

        .contact-col--left {
            width: 40%;
            padding-left: 20px;
        }

        .contact-col--center {
            width: 20%;
            padding-left: 20px;
        }

        .contact-col--right {
            width: 40%;
            display: flex;
            flex-direction: column;       /* Ensure column direction */
            align-items: center;
            justify-content: flex-start;  /* Forces logo to the top */
            padding: 0 20px;
        }

        .contact-container h2 {
            font-family: 'HyperPixel', sans-serif;
            font-size: 1.2rem;
            letter-spacing: -2px;
            text-transform: uppercase;
            color: #000000;
            margin: 0 0 2px 0;
            line-height: 1.2;
        }

        .contact-container p {
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            line-height: 1.6;
            color: #000000;
            margin: 0;
        }

        .contact-container a {
            color: inherit;
            text-decoration: none;
            font-weight: 700;
            transition: opacity 0.3s;
        }

        .contact-container a:hover {
            opacity: 0.6;
        }

        .contact-col--right img {
            width: 90%;
            height: auto;
            max-height: 100%;
            display: block;
            object-fit: contain;
            margin-top: 0; /* Ensure no auto margin pushes it down */
        }

        @media (max-width: 768px) {
            #contact {
                height: auto;
                padding: 20px;
                min-height: 120px;
                align-items: center;
            }

            .contact-container {
                flex-direction: column;
                align-items: center;
                gap: 10px;
                height: auto;
                padding-top: 0;
            }

            .contact-col--left {
                width: 100%;
                padding-left: 0;
                text-align: center;
                height: auto;
            }

            .contact-col--center {
                display: none !important;
            }

            .contact-col--right {
                display: none !important;
            }

            .contact-container h2 {
                text-align: center;
                font-size: 1rem;
            }

            .contact-container p {
                font-size: 0.7rem;
                line-height: 1.5;
            }
        }

        @media (max-width: 480px) {
            #contact {
                padding: 15px;
                min-height: 100px;
            }

            .contact-container h2 {
                font-size: 0.85rem;
            }

            .contact-container p {
                font-size: 0.6rem;
                line-height: 1.4;
            }
        }
    </style>
</head>
<body>

    <section id="contact">
        <div class="contact-container">

            <div class="contact-col contact-col--left">
                <h2>GET IN TOUCH</h2>
                <p>Services &amp; Engineering: <a href="mailto:services@hyperproduction.co.za">services@hyperproduction.co.za</a></p>
                <p>Demo Submissions: <a href="mailto:demo@hyperproduction.co.za">demo@hyperproduction.co.za</a></p>
                <p>General Inquiries: <a href="mailto:info@hyperproduction.co.za">info@hyperproduction.co.za</a></p>
            </div>

            <div class="contact-col contact-col--center">
                <h2>OUTLETS</h2>
                <p><a href="https://www.traxsource.com/label/19884/hyper-production-sa" target="_blank">Traxsource</a></p>
                <p><a href="https://www.beatport.com/label/hyper-production-sa/43113" target="_blank">Beatport</a></p>
            </div>

            <div class="contact-col contact-col--right">
                <img src="https://hyperproduction.co.za/logo/HPSA-indexed.png" alt="Hyper Production (SA) Logo" />
            </div>

        </div>
    </section>

</body>
</html>
