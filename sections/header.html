<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyper Production (SA)</title>
    
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== STICKY HEADER + SLIDE-DOWN ===== */
        #my-sticky-header {
            position: sticky;
            top: 0;
            z-index: 9999;
            width: 100%;
            height: 80px;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.6s ease forwards;
        }

        #my-sticky-header a {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-decoration: none;
        }

        #my-sticky-header img {
            height: 50px;
            width: auto;
            display: block;
        }

        /* ===== SLIDE-DOWN KEYFRAMES ===== */
        @keyframes slideDown {
            0% {
                opacity: 0;
                transform: translateY(-100%);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ONLY ===== -->
    <header id="my-sticky-header">
        <a href="https://hyperproduction.co.za/" title="Home">
            <img 
                src="https://hyperproduction.co.za/logo/HPSA-gold.png" 
                alt="Hyper Production (SA) – Home" 
            />
        </a>
    </header>

</body>
</html>
