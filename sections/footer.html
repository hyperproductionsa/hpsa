<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyper Production (SA)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #my-sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 9999;
            width: 100%;
            height: 60px;
            background: #e5de69;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease forwards;
        }

        #my-sticky-footer .copyright {
            font: 14px Arial, sans-serif;
            color: #000;
        }

        #my-sticky-footer .social-icons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #my-sticky-footer .social-icons a {
            display: flex;
            transition: opacity 0.3s;
        }

        #my-sticky-footer .social-icons a:hover { opacity: 0.7; }
        #my-sticky-footer .social-icons img { height: 30px; width: auto; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            #my-sticky-footer { justify-content: center; padding: 0 15px; }
            #my-sticky-footer .copyright { display: none; }
            #my-sticky-footer .social-icons { gap: 20px; }
            #my-sticky-footer .social-icons img { height: 28px; }
        }
    </style>
</head>
<body>

    <footer id="my-sticky-footer">
        <p class="copyright">&copy; 2026 <strong>Hyper Production (SA)</strong>. All Rights Reserved.</p>
        <div class="social-icons">
            <a href="https://facebook.com/hyperproductionsa" target="_blank" title="Facebook"><img src="https://hyperproduction.co.za/logo/facebook.png" alt="Facebook" /></a>
            <a href="https://instagram.com/hyperprosa" target="_blank" title="Instagram"><img src="https://hyperproduction.co.za/logo/instagram.png" alt="Instagram" /></a>
            <a href="https://www.youtube.com/@hyperproductionsa" target="_blank" title="YouTube"><img src="https://hyperproduction.co.za/logo/youtube.png" alt="YouTube" /></a>
        </div>
    </footer>

</body>
</html>
