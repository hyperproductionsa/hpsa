<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Hyper Production (SA)</title>
    <meta name="description" content="Page not found. Hyper Production (SA) releases catalog." />
    
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="https://hyperproduction.co.za/logo/site-icon.png" type="image/png" />
    
    <style>
        #not-found {
            width: 100%;
            min-height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 140px 20px 100px 20px;
        }
        .not-found-content {
            max-width: 600px;
        }
        .not-found-content h1 {
            font-family: 'HyperPixel', sans-serif;
            font-size: 6rem;
            color: #e4de69;
            margin-bottom: 0;
            letter-spacing: -8px;
        }
        .not-found-content h2 {
            font-family: 'HyperPixel', sans-serif;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 20px;
        }
        .not-found-content p {
            color: #aaa;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .not-found-content a {
            display: inline-block;
            padding: 14px 40px;
            background: #e4de69;
            color: #000;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 50px;
            transition: background .3s, transform .2s;
            border: 2px solid #e4de69;
        }
        .not-found-content a:hover {
            background: transparent;
            color: #e4de69;
            transform: translateY(-3px);
        }
        @media (max-width: 480px) {
            .not-found-content h1 { font-size: 4rem; }
            .not-found-content h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <header id="my-sticky-header">
        <a href="https://hyperproduction.co.za/" title="Home">
            <img src="https://hyperproduction.co.za/logo/HPSA-gold.png" alt="Hyper Production (SA) – Home" />
        </a>
    </header>

    <section id="not-found">
        <div class="not-found-content">
            <h1>404</h1>
            <h2>Lost in the Bass</h2>
            <p>The track you're looking for doesn't exist or has been removed from our catalog.</p>
            <a href="/releases/">Browse Releases</a>
        </div>
    </section>

    <footer id="my-sticky-footer">
        <div class="footer-inner">
            <p class="copyright">&copy; 2026 <strong>Hyper Production (SA)</strong>. All Rights Reserved.</p>
            <div class="social-icons">
                <a href="https://facebook.com/hyperproductionsa" target="_blank" title="Facebook"><img src="https://hyperproduction.co.za/logo/facebook.png" alt="Facebook" /></a>
                <a href="https://instagram.com/hyperprosa" target="_blank" title="Instagram"><img src="https://hyperproduction.co.za/logo/instagram.png" alt="Instagram" /></a>
                <a href="https://www.youtube.com/@hyperproductionsa" target="_blank" title="YouTube"><img src="https://hyperproduction.co.za/logo/youtube.png" alt="YouTube" /></a>
            </div>
        </div>
    </footer>
</body>
</html>
