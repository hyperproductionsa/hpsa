<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Hyper Production (SA)</title>
    <link rel="canonical" href="https://hyperproduction.co.za/contact/" />
    <meta name="description" content="Contact Hyper Production (SA). Mixing, mastering, cover art, logo design, social media kits, demo submissions, and general enquiries." />

    <meta property="og:title" content="Contact | Hyper Production (SA)" />
    <meta property="og:description" content="Get in touch with Hyper Production (SA)." />
    <meta property="og:image" content="https://hyperproduction.co.za/logo/fb-thumb.png" />
    <meta property="og:url" content="https://hyperproduction.co.za/contact/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hyper Production (SA)" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contact | Hyper Production (SA)" />
    <meta name="twitter:description" content="Get in touch with Hyper Production (SA)." />
    <meta name="twitter:image" content="https://hyperproduction.co.za/logo/x-thumb.png" />
    <meta name="twitter:site" content="@hyperprosa" />

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="https://hyperproduction.co.za/logo/site-icon.png" type="image/png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ContactPage",
      "@id": "https://hyperproduction.co.za/contact/#page",
      "name": "Contact Hyper Production (SA) | Music Services",
      "url": "https://hyperproduction.co.za/contact/",
      "about": {
        "@type": "Organization",
        "@id": "https://hyperproduction.co.za/#label",
        "name": "Hyper Production (SA)",
        "url": "https://hyperproduction.co.za/"
      },
      "mainEntity": {
        "@type": "Organization",
        "@id": "https://hyperproduction.co.za/#label",
        "name": "Hyper Production (SA)",
        "url": "https://hyperproduction.co.za/"
      }
    }
    </script>
</head>
<body>

    <header id="my-sticky-header">
        <a href="https://hyperproduction.co.za/" title="Home">
            <img src="https://hyperproduction.co.za/logo/HPSA-gold.png" alt="Hyper Production (SA) – Home" />
        </a>
    </header>

    <section id="demo-page">
        <div class="demo-container">

            <div id="demo-form-container">
                <h1>CONTACT</h1>
                <p class="subtitle">
                    Tell us what you need — <strong>services</strong>, <strong>design</strong>, or a <strong>general enquiry</strong>.
                </p>

                <div class="error-message" id="error-message"></div>
                <div class="error-message" id="link-error" style="border-color:#e5de69;color:#e5de69;"></div>

                <form id="demo-form">
                    <!-- Honeypot — real users leave this blank -->
                    <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;" aria-hidden="true" />

                    <div class="form-group">
                        <label for="name">Your Name <span class="required">*</span></label>
                        <input type="text" id="name" name="name" placeholder="e.g. Thabo Mokoena" required />
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" required />
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject / Service <span class="required">*</span></label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>— Please choose a service —</option>
                            <option value="Mixing">Mixing</option>
                            <option value="Mastering">Mastering</option>
                            <option value="Cover Art">Cover Art</option>
                            <option value="Logo">Logo</option>
                            <option value="Social Media Kit">Social Media Kit</option>
                            <option value="Demo Submission">Demo Submission</option>
                            <option value="General">General</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Your Message <span class="required">*</span></label>
                        <textarea id="message" name="message" rows="6" placeholder="Tell us about your project, timeline, and any links we should hear…" required></textarea>
                    </div>

                    <div class="form-group checkbox">
                        <input type="checkbox" id="privacy-consent" name="privacy_consent" required />
                        <label for="privacy-consent">
                            I consent to Hyper Production (SA) storing and processing my personal information
                            for the purpose of responding to my enquiry.
                            <a href="/privacy/" target="_blank">Privacy Policy</a>.
                            <span class="required">*</span>
                        </label>
                    </div>

                    <button type="submit" class="submit-btn" id="submit-btn">
                        <span id="submit-text">Send Message</span>
                        <span class="spinner" id="submit-spinner"></span>
                    </button>
                </form>
            </div>

            <div class="success-message" id="success-message">
                <div class="checkmark">✅</div>
                <h2>Message Sent!</h2>
                <p>
                    Thank you for contacting Hyper Production (SA).<br />
                    We’ll get back to you within 24–48 hours.
                </p>
                <a href="/" class="back-link">← Return Home</a>
            </div>

        </div>
    </section>

     <footer id="my-sticky-footer">
        <div class="footer-inner">
            <p class="copyright">&copy; 2026 <strong>Hyper Production (SA)</strong>. All Rights Reserved.</p>
            <div class="social-icons">
                <a href="https://facebook.com/hyperproductionsa" target="_blank" title="Facebook"><img src="https://hyperproduction.co.za/logo/facebook.png" alt="Facebook" /></a>
                <a href="https://instagram.com/hyperprosa" target="_blank" title="Instagram"><img src="https://hyperproduction.co.za/logo/instagram.png" alt="Instagram" /></a>
                <a href="https://www.youtube.com/@hyperproductionsa" target="_blank" title="YouTube"><img src="https://hyperproduction.co.za/logo/youtube.png" alt="YouTube" /></a>
            </div>
        </div>
    </footer>

    <script src="/js/contact.js"></script>

</body>
</html>
